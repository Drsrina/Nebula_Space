# ==============================================================================
# Nebula Workspace v2.8.1 - Docker Compose Template Pronto para Produção & VPS
# ==============================================================================
#
# Modo Padrão (Ultra-Leve para VPS Pequenas de 1GB - 2GB RAM):
#   - Sobe apenas o container principal com Node 22 e Python 3 nativos integrados.
#   - Comando: docker compose up -d
#
# Modo com Runners Isolados Opcionais (Sidecars Python & Node/TS):
#   - Sobe containers dedicados para isolar a execução de scripts e automações pesadas.
#   - Comando: docker compose --profile runners up -d
#
# Acesso: http://localhost:3000 (ou http://seu-ip:3000)
# Credenciais Padrão: admin / admin123
# ==============================================================================

services:
  nebula:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebula-workspace
    restart: unless-stopped

    # Mapeamento de portas (Host:Container)
    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000

      # ── Autenticação & Senhas ─────────────────────────────────────────────
      # Senha mestra inicial. Pode ser alterada no painel de Configurações Globais.
      - NEBULA_PASSWORD=${NEBULA_PASSWORD:-admin123}
      - NEBULA_ADMIN_PASSWORD=${NEBULA_ADMIN_PASSWORD:-admin123}
      - NEBULA_ADMIN_USER=${NEBULA_ADMIN_USER:-admin}

      # ── Autenticação em Dois Fatores (MFA / 2FA TOTP) ─────────────────────
      - NEBULA_MFA_SETUP=${NEBULA_MFA_SETUP:-true}
      - NEBULA_MFA_SECRET=${NEBULA_MFA_SECRET:-}

      # ── Sessão & Assinatura de Tokens (JWT) ──────────────────────────────
      - NEBULA_JWT_SECRET=${NEBULA_JWT_SECRET:-nebula_super_secure_jwt_secret_change_in_production_key_32chars}

      # ── Isolamento do Sistema de Arquivos & Workspaces ────────────────────
      - NEBULA_ROOTS=${NEBULA_ROOTS:-/:/workspace:/data}
      - NEBULA_READONLY=${NEBULA_READONLY:-false}

      # ── Integrações Opcionais ─────────────────────────────────────────────
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}

    volumes:
      # Persistência de dados, notas, senhas alteradas e auth-config.json
      - ./data:/data
      # Volume do seu código-fonte / workspace de trabalho principal
      - ./workspace:/workspace
      # Acesso ao Docker Daemon para a janela Docker Monitor (funciona em Linux e Docker Desktop)
      - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # SUB-CONTAINERS / RUNNERS OPCIONAIS (Isolamento de Scripts & Automações)
  # Ative apenas se desejar isolar execuções: docker compose --profile runners up -d
  # ============================================================================
  runner-python:
    image: python:3.11-slim
    container_name: nebula-runner-python
    restart: unless-stopped
    profiles:
      - runners
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    deploy:
      resources:
        limits:
          memory: 512M

  runner-node:
    image: node:22-alpine
    container_name: nebula-runner-node
    restart: unless-stopped
    profiles:
      - runners
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    deploy:
      resources:
        limits:
          memory: 512M
